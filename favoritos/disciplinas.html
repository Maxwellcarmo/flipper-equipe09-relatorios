<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipper - Todas as Disciplinas</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="flipper-header">
        <div class="header-content">
            <img src = "img/logo.jpg"alt="Logo Flipper" class="flipper-logo">
            <div class="flipper-text">
                <h2>Flipper</h2>
                <p>Conectando Conhecimento</p>
                <a href="https://flippercoad.com.br" target="_blank">flippercoad.com.br</a>
            </div>
        </div>
    </header>
   <div class="title-container">
        <h1>Todas as Disciplinas</h1>
        
        <button class="schedule-button" onclick="window.location.href='meusFavoritos.html'">
            Voltar
        </button>
    </div>
    <div class="search-container">
        <input type="text" id="search-bar" placeholder="Pesquisar disciplina pelo nome...">
    </div>

    <div class="card-container" id="disciplinas-container">
        <p id="loading-message">Carregando disciplinas...</p>
    </div>

    <script src="disciplinas.js" defer></script>

</body>
</html>
